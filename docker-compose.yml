services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telemetry}"]
      interval: 5s
      timeout: 3s
      retries: 10

  spacecraft:
    build:
      context: .
      dockerfile: spacecraft/Dockerfile
    environment:
      INGEST_HOST: ingest
      INGEST_PORT: "10015"
      DROP_PROB: ${DROP_PROB:-0.02}
      CORRUPT_PROB: ${CORRUPT_PROB:-0.01}
    volumes:
      - ./config/telemetry_dictionary.yaml:/app/config/telemetry_dictionary.yaml:ro
    depends_on:
      - ingest

  ingest:
    build:
      context: .
      dockerfile: ground/ingest/Dockerfile
    environment:
      INGEST_PORT: "10015"
      REDIS_HOST: redis
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
    volumes:
      - ./config/telemetry_dictionary.yaml:/app/config/telemetry_dictionary.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: ground/api/Dockerfile
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: timescaledb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./config/telemetry_dictionary.yaml:/app/config/telemetry_dictionary.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  timescale-data:
